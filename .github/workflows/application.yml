name: Build and release FastAPI
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/application.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after image build? (select false until Terraform creates the Container App)"
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: app-dev
  cancel-in-progress: false
jobs:
  build_release:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Tests
        run: |
          pip install -r app/requirements-dev.txt
          cd app && pytest -q
      - uses: azure/login@v2
        if: vars.FOUNDATION_READY == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build in ACR
        if: vars.FOUNDATION_READY == 'true'
        env:
          REGISTRY: ${{ vars.ACR_NAME }}
        run: az acr build --registry "$REGISTRY" --image "climate-api:${GITHUB_SHA}" ./app
      - name: Update Container App (if enabled)
        if: ${{ vars.FOUNDATION_READY == 'true' && ((github.event_name == 'push' && vars.ENABLE_APP == 'true') || (github.event_name == 'workflow_dispatch' && inputs.deploy)) }}
        env:
          IMAGE_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          APP_RG: ${{ vars.APP_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.APP_CONTAINER_NAME }}
        run: |
          az containerapp update \
            --resource-group "$APP_RG" \
            --name "$APP_NAME" \
            --image "${IMAGE_SERVER}/climate-api:${GITHUB_SHA}"
